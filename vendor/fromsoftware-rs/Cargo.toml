# Vendored subset of https://github.com/vswarte/fromsoftware-rs @ 59fbd3b3b7daaf14aca47c9f73530493dba6bc79
# (crates shared + shared/stl + sekiro only). We vendored it so we can fix a bug in the Sekiro
# game-version name and add the Sekiro character/havok/camera structures the crate is missing.
# Original license: MIT OR Apache-2.0 (see LICENSE-MIT / LICENSE-ASL2).
[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/shared/stl",
    "crates/sekiro",
]
default-members = [
    "crates/shared",
    "crates/shared/stl",
    "crates/sekiro",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
repository = "https://github.com/vswarte/fromsoftware-rs"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fromsoftware-shared = { path = "crates/shared", version = "0.14.0", package = "fromsoftware-shared" }
fromsoftware-shared-macros = { path = "crates/shared/macros", version = "0.14.0", package = "fromsoftware-shared-macros" }
fromsoftware-shared-stl = { path = "crates/shared/stl", version = "0.14.0", package = "fromsoftware-shared-stl" }
sekiro = { path = "crates/sekiro", version = "0.14.0", package = "sekiro" }
bitflags = "2.13.1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2.5"
tracing-panic = "0.1"
glam = ">= 0.30"
byteorder = "1"
pelite = "0.10"
vtable-rs = "0.1.5"
bitfield = "0.19.5"
encoding_rs = "0.8.35"
libhotpatch = "1.2.0"
toml = "1.1.4"
num_enum = "0.7"

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[workspace.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Security",
]
