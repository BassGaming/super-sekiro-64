# rom = "C:\path\to\super_mario_64.z64"  (else the first .z64 / .n64 / .v64 file in this folder)

# Mario's hits are the game's bullets carrying Sekiro's attack rows (AtkParam_Pc).
# sword_hits = true    (back to Sekiro's sword swinging for Mario)
# atk_punch = 5000000  (punches and kicks)
# atk_dive = 5000000   (dives and slide kicks)
# atk_pound = 5000010  (ground pound landings)
# atk_throw = 5000010  (a thrown boss crashing)
# grab_from_any_side = true  (grab bosses from the front too)

# Damage and boss grabs (the numbers shown are the defaults)
damage = 1.0             (multiplier for the HP Mario's hits take; Shift+F2 / Shift+F3 change it in game)
boss_hit_chance = 0.4    (share of the hits a guarding boss blocks that get through anyway)
boss_hit_blocks = 3      (blocked hits in a row before the next one gets through for sure)
boss_hit_punch = 3       (% of a boss's max HP a punch or kick that gets through takes)
boss_hit_dive = 3        (% for a dive or slide kick)
boss_hit_pound = 6       (% for a ground pound)
boss_hit_throw = 8       (% for a thrown boss crashing)
grab_chance = 0.2        (chance a punch from behind grabs the boss by the tail)
throw_posture = 20       (% of a boss's max posture a throw adds when he lands)
throw_return_delay = 3   (seconds before a boss thrown out of reach comes back next to Mario)

# action_button = x  (the button Sekiro's prompts ask for; Y on the pad presses it. "y" if your prompts show Y)

# Troubleshooting (frame rate): switch parts off to find a slow one (remove the # in front)
# mod = off      (nothing of the mod runs but the frame counter in the log)
# hud = off      (Mario's health meter, the F-key messages and F1's list)
# popups = off   (Y confirming popups and conversations)
# winding = keep  (only if Mario falls through every floor: the collision faces the other way)
# title = off   (no "Super Sekiro 64" title logo: the mod doesn't build its sk_mario_title package)
